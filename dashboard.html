const EMAILJS_PUBLIC_KEY = APP_CONFIG.emailjs.publicKey;
const EMAILJS_SERVICE_ID = APP_CONFIG.emailjs.serviceId;
const EMAILJS_TXN_TEMPLATE_ID = APP_CONFIG.emailjs.txnTemplateId;

const CUSTOMER_VIEW_BASE_URL = APP_CONFIG.pageUrl('customer-view.html'); // repo URL hardcode nahi - app-config.js se

if (typeof emailjs !== 'undefined') {
  emailjs.init(EMAILJS_PUBLIC_KEY);
  console.log('✅ EmailJS initialized');
}

// ... original JS preserved ...

/* ============ EMAIL ============ */
async function sendTransactionEmail(customer, txnType, amount, note, date, newBalance) {
  try {
    if (!customer || !customer.email) { console.log('ℹ️ No customer email'); return false; }
    
    // Color Logic: Jama, Loan Repay, Interest Paid = Green. Baaki (Udhaar/Loan) = Red
    let amountColor = "#f87171"; // Red
    if (txnType === 'jama' || txnType === 'loan_repay' || txnType === 'interest_paid') {
      amountColor = "#4ade80"; // Green
    }

    const fullCustomer = customers.find(x => x.email === customer.email);
    const viewLink = fullCustomer && fullCustomer.viewToken ? getCustomerViewLink(fullCustomer.viewToken) : '';
    
    console.log('📧 Sending customer email with Color:', amountColor);
    
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TXN_TEMPLATE_ID, {
      // VIP Template ke Variables
      to_name: customer.name || 'Customer', 
      transaction_type: getTxnTypeLabel(txnType),
      amount: (amount || 0).toLocaleString('en-IN'), 
      total_balance: Math.abs(newBalance).toLocaleString('en-IN'), 
      date: dateStr(date),
      amount_color: amountColor, 
      dashboard_link: viewLink,
      shop_name: userData?.shopName || 'BSRPRO Digital Khata',
      shop_email: currentUser.email,
      
      // Purane variables (Safety ke liye)
      customer_name: customer.name || 'Customer',
      customer_email: customer.email,
      note: note || '—',
      balance: Math.abs(newBalance).toLocaleString('en-IN')
    });
    
    console.log('✅ Customer email sent');
    return true;
  } catch (e) { 
    console.error('❌ Email error:', e); 
    return false; 
  }
}

// ... rest of original JS preserved ...
</script>
