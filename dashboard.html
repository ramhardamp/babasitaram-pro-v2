<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1e1b4b">
<title>Dashboard - BABASITARAM PRO</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📒</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--primary:#6366f1;--primary-dark:#4f46e5;--primary-light:#e0e7ff;--primary-lighter:#eef2ff;--gradient:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#a855f7 100%);--gradient-dark:linear-gradient(135deg,#1e1b4b 0%,#312e81 100%);--credit:#ef4444;--credit-bg:#fef2f2;--debit:#10b981;--debit-bg:#ecfdf5;--interest:#f59e0b;--interest-bg:#fffbeb;--info:#3b82f6;--info-bg:#eff6ff;--violet:#7c3aed;--violet-bg:#f5f3ff;--text:#0f172a;--text-muted:#64748b;--text-light:#94a3b8;--border:#e2e8f0;--bg:#f8fafc;--white:#fff;--error:#ef4444;--error-bg:#fef2f2;--success:#10b981;--success-bg:#ecfdf5;--radius-sm:8px;--radius-md:14px;--radius-lg:20px;--radius-xl:28px;--radius-full:999px}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans Devanagari',sans-serif;background:linear-gradient(135deg,#1e1b4b 0%,#312e81 50%,#4c1d95 100%);color:var(--text);font-size:16px;line-height:1.5;overflow-x:hidden}
body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh}
.app-shell{width:100%;max-width:480px;min-height:100vh;background:var(--bg);position:relative;box-shadow:0 0 80px rgba(0,0,0,.3);overflow:hidden;display:flex;flex-direction:column}
@media(min-width:500px){body{padding:24px 0}.app-shell{min-height:calc(100vh - 48px);border-radius:32px;max-height:940px}}

/* TOP BAR */
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.3);position:sticky;top:0;z-index:50;flex-shrink:0}
.top-title{font-size:15px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{background:rgba(99,102,241,.1);border:none;font-size:16px;color:var(--primary);cursor:pointer;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-left:6px}
.icon-btn:active{background:rgba(99,102,241,.2)}
.screen-container{flex:1;overflow-y:auto;padding-bottom:90px}
.screen-container::-webkit-scrollbar{width:0}
.screen{display:none;animation:fadeSlide .3s}
.screen.active{display:block}
@keyframes fadeSlide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* DASH HERO */
.dash-hero{background:var(--gradient-dark);color:#fff;padding:22px 20px 24px;border-radius:0 0 28px 28px;margin-bottom:16px;box-shadow:0 12px 40px rgba(30,27,75,.3);position:relative;overflow:hidden}
.dash-hero::before{content:'';position:absolute;top:-50%;right:-30%;width:250px;height:250px;background:radial-gradient(circle,rgba(139,92,246,.4) 0%,transparent 70%);border-radius:50%}
.dash-greeting{font-size:11px;opacity:.8;margin-bottom:4px;position:relative;letter-spacing:.5px;text-transform:uppercase;font-weight:700}
.dash-shop{font-size:18px;font-weight:900;margin-bottom:16px;position:relative}
.dash-total-label{font-size:11px;opacity:.75;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;position:relative}
.dash-total-amount{font-size:38px;font-weight:900;margin-top:4px;position:relative;letter-spacing:-1.2px;line-height:1}
.dash-split{display:flex;gap:8px;margin-top:16px;position:relative}
.dash-split-item{flex:1;background:rgba(255,255,255,.1);border-radius:12px;padding:10px 12px;border:1px solid rgba(255,255,255,.15)}
.dash-split-label{font-size:9px;opacity:.85;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.dash-split-value{font-size:15px;font-weight:900;margin-top:3px}
.dash-split-value.red{color:#fca5a5}
.dash-split-value.amber{color:#fcd34d}

/* QUICK ACTIONS */
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px 14px}
.quick-btn{background:var(--white);border:2px solid var(--border);border-radius:var(--radius-md);padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;transition:all .2s}
.quick-btn:active{transform:scale(.96);border-color:var(--primary);background:var(--primary-lighter)}
.quick-icon{font-size:20px}
.quick-lbl{font-size:9px;font-weight:800;color:var(--text);text-align:center;line-height:1.15}

/* TABS */
.tabs{display:flex;gap:6px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:var(--radius-full);background:var(--white);border:2px solid var(--border);font-size:12px;font-weight:800;color:var(--text-muted);cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .2s}
.tab.active{background:var(--primary-lighter);color:var(--primary);border-color:var(--primary)}

/* CUSTOMER CARD */
.party-list{padding:0 16px}
.party-card{background:var(--white);border:2px solid var(--border);border-radius:var(--radius-md);padding:14px;margin-bottom:10px;cursor:pointer;transition:all .2s}
.party-card:active{border-color:var(--primary);transform:scale(.99)}
.party-card.customer{border-left:4px solid var(--info)}
.party-card.supplier{border-left:4px solid var(--violet)}
.pc-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pc-avatar{width:42px;height:42px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;flex-shrink:0;box-shadow:0 4px 12px rgba(99,102,241,.3)}
.pc-avatar.customer{background:linear-gradient(135deg,#3b82f6 0%,#6366f1 100%)}
.pc-avatar.supplier{background:linear-gradient(135deg,#7c3aed 0%,#a855f7 100%)}
.pc-info{flex:1;min-width:0}
.pc-name{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-phone{font-size:11px;color:var(--text-muted);margin-top:2px}
.pc-badge{font-size:9px;font-weight:900;padding:2px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:.5px;display:inline-block;margin-left:4px}
.pc-badge.customer{background:var(--info-bg);color:var(--info)}
.pc-badge.supplier{background:var(--violet-bg);color:var(--violet)}
.pc-balance{text-align:right;flex-shrink:0}
.pc-balance-amt{font-size:16px;font-weight:900;letter-spacing:-.3px}
.pc-balance-amt.credit{color:var(--credit)}
.pc-balance-amt.debit{color:var(--debit)}
.pc-balance-amt.zero{color:var(--text-muted)}
.pc-balance-lbl{font-size:9px;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-top:2px}

/* EMPTY */
.empty-state{text-align:center;padding:50px 20px;color:var(--text-muted)}
.empty-icon{font-size:60px;margin-bottom:14px;opacity:.4}
.empty-title{font-size:16px;font-weight:800;color:var(--text);margin-bottom:6px}
.empty-text{font-size:13px;line-height:1.5}

/* BOTTOM TABS */
.bottom-tabs{position:absolute;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding:6px 4px 10px;z-index:40;box-shadow:0 -8px 32px rgba(31,38,135,.1)}
.btab{flex:1;background:none;border:none;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-muted);font-family:inherit;position:relative}
.btab.active{color:var(--primary)}
.btab.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:3px;background:var(--gradient);border-radius:0 0 4px 4px}
.btab-icon{font-size:20px}
.btab-lbl{font-size:10px;font-weight:800}

/* FAB */
.fab{position:absolute;bottom:90px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--gradient);color:#fff;border:none;font-size:28px;cursor:pointer;z-index:30;box-shadow:0 8px 24px rgba(99,102,241,.5);display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.92)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s;backdrop-filter:blur(4px)}
@media(min-width:500px){.modal-overlay{align-items:center}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--white);width:100%;max-width:480px;border-radius:var(--radius-xl) var(--radius-xl) 0 0;padding:20px;max-height:92vh;overflow-y:auto;animation:slideUp .3s cubic-bezier(.4,0,.2,1)}
@media(min-width:500px){.modal{border-radius:var(--radius-xl);max-height:88vh}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:18px;font-weight:900;margin-bottom:18px;text-align:center}
.input-group{margin-bottom:14px}
.input-label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.text-input,.select-input{width:100%;border:2px solid var(--border);border-radius:var(--radius-md);padding:13px 14px;font-size:15px;font-weight:500;font-family:inherit;outline:none;background:var(--white);color:var(--text);transition:all .2s;height:52px}
.text-input:focus,.select-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-light)}
.input-prefix-wrap{position:relative}
.input-prefix{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px;font-weight:800;color:var(--text-muted);pointer-events:none}
.input-prefix-wrap .text-input{padding-left:38px}
.helper-text{font-size:11px;color:var(--text-muted);margin-top:5px;padding-left:4px}
.btn{width:100%;padding:14px 20px;font-size:15px;font-weight:800;border:none;border-radius:var(--radius-md);cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;transition:all .2s}
.btn-primary{background:var(--gradient);color:#fff;box-shadow:0 6px 20px rgba(99,102,241,.35);margin-top:6px}
.btn-primary:disabled{background:#cbd5e1;cursor:not-allowed}
.btn-secondary{background:var(--white);color:var(--text);border:2px solid var(--border);margin-top:8px}
.btn-danger{background:var(--credit-bg);color:var(--credit);border:2px solid #fecaca;margin-top:8px}
.modal-actions{display:flex;gap:10px;margin-top:10px}
.modal-actions .btn{flex:1;margin-top:0}
.error-text{color:var(--error);font-size:12px;margin-top:10px;text-align:center;padding:10px 14px;background:var(--error-bg);border-radius:var(--radius-sm);font-weight:600;border:1px solid #fecaca}
.hidden{display:none!important}
.spinner{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:13px 24px;border-radius:var(--radius-full);font-size:13px;font-weight:700;z-index:999;opacity:0;transition:all .3s;pointer-events:none;max-width:90%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--success)}
.toast.error{background:var(--error)}

/* PARTY DETAIL */
.detail-wrap{padding:16px}
.party-hero{background:var(--gradient-dark);color:#fff;padding:20px;border-radius:var(--radius-lg);margin-bottom:14px;position:relative;overflow:hidden}
.party-hero::before{content:'';position:absolute;top:-40%;right:-20%;width:200px;height:200px;background:radial-gradient(circle,rgba(139,92,246,.4) 0%,transparent 70%);border-radius:50%}
.ph-header{display:flex;align-items:center;gap:12px;position:relative;margin-bottom:16px}
.ph-avatar{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;flex-shrink:0}
.ph-name{font-size:18px;font-weight:900}
.ph-meta{font-size:12px;opacity:.85;margin-top:2px}
.ph-bal-label{font-size:11px;opacity:.75;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;position:relative}
.ph-bal-amount{font-size:34px;font-weight:900;margin-top:4px;position:relative;letter-spacing:-1px;line-height:1}
.ph-split{display:flex;gap:8px;margin-top:14px;position:relative}
.ph-split-item{flex:1;background:rgba(255,255,255,.12);border-radius:10px;padding:10px;border:1px solid rgba(255,255,255,.15)}
.ph-split-label{font-size:9px;opacity:.8;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.ph-split-value{font-size:15px;font-weight:900;margin-top:3px}
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.action-btn{background:var(--white);border:2px solid var(--border);border-radius:var(--radius-md);padding:12px 10px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:10px;transition:all .2s;text-align:left}
.action-btn:active{transform:scale(.97)}
.action-btn.wide{grid-column:1/-1}
.action-icon{font-size:22px;flex-shrink:0}
.action-title{font-size:13px;font-weight:800}
.action-sub{font-size:10px;color:var(--text-muted);margin-top:1px}
.action-btn.udhaar{border-color:#fecaca;background:var(--credit-bg)}
.action-btn.jama{border-color:#bbf7d0;background:var(--debit-bg)}
.action-btn.loan{border-color:#fde68a;background:var(--interest-bg)}
.action-btn.edit{border-color:#e2e8f0}
.section-title{font-size:12px;font-weight:900;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin:20px 0 10px}
.txn-item{background:var(--white);border:1.5px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:6px;display:flex;align-items:center;gap:12px}
.txn-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.txn-icon.udhaar{background:var(--credit-bg)}
.txn-icon.jama{background:var(--debit-bg)}
.txn-icon.byaj_loan{background:var(--interest-bg)}
.txn-icon.loan_repay{background:var(--info-bg)}
.txn-icon.interest_paid{background:var(--violet-bg)}
.txn-info{flex:1;min-width:0}
.txn-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txn-date{font-size:11px;color:var(--text-muted);margin-top:2px}
.txn-amt{font-size:14px;font-weight:900;flex-shrink:0}
.txn-amt.udhaar{color:var(--credit)}
.txn-amt.jama{color:var(--debit)}
.txn-amt.byaj_loan{color:var(--interest)}
.txn-amt.loan_repay{color:var(--info)}
.txn-amt.interest_paid{color:var(--violet)}

/* LOADING */
.loading-wrap{display:flex;align-items:center;justify-content:center;min-height:60vh;flex-direction:column;gap:16px}
.loading-spinner{width:40px;height:40px;border:4px solid var(--primary-light);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite}
.loading-text{font-size:14px;color:var(--text-muted);font-weight:600}

@media(max-width:360px){.dash-total-amount{font-size:30px}.quick-grid{grid-template-columns:repeat(2,1fr)}}
@media(prefers-color-scheme:dark){:root{--text:#f1f5f9;--text-muted:#94a3b8;--text-light:#64748b;--border:#334155;--bg:#0f172a;--white:#1e293b;--primary-lighter:#1e1b4b;--primary-light:#312e81;--credit-bg:#450a0a;--debit-bg:#052e16;--interest-bg:#451a03;--info-bg:#172554;--violet-bg:#2e1065}body{background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 100%)}.text-input,.select-input{color:var(--text);background:var(--white)}.bottom-tabs,.top-bar{background:rgba(30,27,75,.95)}}
</style>
</head>
<body>
<div class="app-shell" id="appShell">

  <div class="top-bar">
    <div class="top-title" id="topTitle">📒 Loading...</div>
    <button class="icon-btn" onclick="openSettings()" title="Settings">⚙️</button>
    <button class="icon-btn" onclick="handleLogout()" title="Logout">🚪</button>
  </div>

  <div class="screen-container" id="screenContainer">

    <!-- LOADING -->
    <div id="loadingScreen">
      <div class="loading-wrap">
        <div class="loading-spinner"></div>
        <div class="loading-text">Data load ho raha hai...</div>
      </div>
    </div>

    <!-- DASHBOARD -->
    <div id="screen-dashboard" class="screen">
      <div class="dash-hero">
        <div class="dash-greeting">नमस्ते 👋</div>
        <div class="dash-shop" id="dashShop">मेरा व्यवसाय</div>
        <div class="dash-total-label">कुल बकाया (ग्राहकों से)</div>
        <div class="dash-total-amount" id="dashTotal">₹0</div>
        <div class="dash-split">
          <div class="dash-split-item">
            <div class="dash-split-label">📤 उधार</div>
            <div class="dash-split-value red" id="dashUdhaar">₹0</div>
          </div>
          <div class="dash-split-item">
            <div class="dash-split-label">📈 ब्याज</div>
            <div class="dash-split-value amber" id="dashByaj">₹0</div>
          </div>
        </div>
      </div>

      <div class="quick-grid">
        <button class="quick-btn" onclick="openAddParty('customer')">
          <div class="quick-icon">👤</div>
          <div class="quick-lbl">ग्राहक</div>
        </button>
        <button class="quick-btn" onclick="openAddParty('supplier')">
          <div class="quick-icon">🏭</div>
          <div class="quick-lbl">सप्लायर</div>
        </button>
        <button class="quick-btn" onclick="switchTab('reports')">
          <div class="quick-icon">📊</div>
          <div class="quick-lbl">रिपोर्ट</div>
        </button>
        <button class="quick-btn" onclick="openSettings()">
          <div class="quick-icon">⚙️</div>
          <div class="quick-lbl">सेटिंग</div>
        </button>
      </div>

      <div class="tabs">
        <div class="tab active" data-filter="all" onclick="setFilter('all')">सभी</div>
        <div class="tab" data-filter="customer" onclick="setFilter('customer')">👤 ग्राहक</div>
        <div class="tab" data-filter="supplier" onclick="setFilter('supplier')">🏭 सप्लायर</div>
        <div class="tab" data-filter="udhaar" onclick="setFilter('udhaar')">📤 उधार वाले</div>
      </div>

      <div class="party-list" id="partyList"></div>
    </div>

    <!-- PARTY DETAIL -->
    <div id="screen-party" class="screen">
      <div class="detail-wrap" id="partyDetail"></div>
    </div>

    <!-- REPORTS -->
    <div id="screen-reports" class="screen">
      <div style="padding:16px">
        <div style="font-size:18px;font-weight:900;margin-bottom:14px">📊 रिपोर्ट</div>
        <div id="reportsContent"></div>
      </div>
    </div>

  </div>

  <button class="fab" id="fab" onclick="openQuickAdd()">+</button>

  <div class="bottom-tabs">
    <button class="btab active" data-view="dashboard" onclick="switchTab('dashboard')">
      <div class="btab-icon">🏠</div>
      <div class="btab-lbl">होम</div>
    </button>
    <button class="btab" data-view="reports" onclick="switchTab('reports')">
      <div class="btab-icon">📊</div>
      <div class="btab-lbl">रिपोर्ट</div>
    </button>
    <button class="btab" data-view="settings" onclick="switchTab('settings')">
      <div class="btab-icon">⚙️</div>
      <div class="btab-lbl">सेटिंग</div>
    </button>
  </div>

</div>

<div class="toast" id="toast"></div>

<!-- FIREBASE SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<!-- FIREBASE CONFIG -->
<script src="firebase-config.js"></script>

<script>
/* ============================================================
   BABASITARAM PRO - REAL DASHBOARD with FIRESTORE
============================================================ */

let currentUser = null;
let userData = null;
let parties = [];        // Customers + Suppliers
let transactions = [];   // All transactions
let currentFilter = 'all';
let currentPartyId = null;
let unsubParties = null;
let unsubTransactions = null;

/* ============ INIT ============ */
auth.onAuthStateChanged(async (user) => {
  if (!user) {
    window.location.href = 'index.html';
    return;
  }
  currentUser = user;
  console.log('✅ User:', user.email);
  await loadUserData();
});

/* ============ LOAD USER DATA ============ */
async function loadUserData() {
  try {
    const doc = await db.collection('users').doc(currentUser.uid).get();
    if (!doc.exists) {
      window.location.href = 'signup.html';
      return;
    }
    userData = doc.data();
    
    // Check setup complete
    if (!userData.shopName) {
      window.location.href = 'signup.html';
      return;
    }

    document.getElementById('dashShop').textContent = userData.shopName || 'मेरा व्यवसाय';
    document.getElementById('topTitle').textContent = '📒 ' + (userData.shopName || 'BABASITARAM PRO');

    // Hide loading, show dashboard
    document.getElementById('loadingScreen').style.display = 'none';
    switchTab('dashboard');

    // Setup real-time listeners
    setupRealtimeListeners();

  } catch (error) {
    console.error('Load user error:', error);
    showToast('Data load nahi hua', 'error');
  }
}

/* ============ REAL-TIME LISTENERS ============ */
function setupRealtimeListeners() {
  // Parties (Customers + Suppliers)
  unsubParties = db.collection('users').doc(currentUser.uid)
    .collection('parties')
    .onSnapshot(snapshot => {
      parties = [];
      snapshot.forEach(doc => {
        parties.push({ id: doc.id, ...doc.data() });
      });
      console.log('📋 Parties loaded:', parties.length);
      if (document.getElementById('screen-dashboard').classList.contains('active')) {
        renderDashboard();
      }
    }, err => console.error('Parties error:', err));

  // Transactions
  unsubTransactions = db.collection('users').doc(currentUser.uid)
    .collection('transactions')
    .orderBy('date', 'desc')
    .onSnapshot(snapshot => {
      transactions = [];
      snapshot.forEach(doc => {
        transactions.push({ id: doc.id, ...doc.data() });
      });
      console.log('📝 Transactions loaded:', transactions.length);
      if (document.getElementById('screen-dashboard').classList.contains('active')) {
        renderDashboard();
      }
    }, err => console.error('Transactions error:', err));
}

/* ============ RENDER DASHBOARD ============ */
function renderDashboard() {
  // Calculate totals
  let totalUdhaar = 0;
  let totalByaj = 0;
  
  parties.forEach(p => {
    if (p.type === 'customer' && p.balance > 0) {
      totalUdhaar += p.balance;
    }
  });

  document.getElementById('dashTotal').textContent = fmt(totalUdhaar + totalByaj);
  document.getElementById('dashUdhaar').textContent = fmt(totalUdhaar);
  document.getElementById('dashByaj').textContent = fmt(totalByaj);

  // Filter parties
  let filtered = parties;
  if (currentFilter === 'customer') filtered = parties.filter(p => p.type === 'customer');
  else if (currentFilter === 'supplier') filtered = parties.filter(p => p.type === 'supplier');
  else if (currentFilter === 'udhaar') filtered = parties.filter(p => p.balance > 0);

  const list = document.getElementById('partyList');
  
  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">👥</div>
        <div class="empty-title">कोई ग्राहक नहीं</div>
        <div class="empty-text">नीचे + बटन दबाकर पहला ग्राहक जोड़ें</div>
      </div>
    `;
    return;
  }

  list.innerHTML = filtered.map(p => renderPartyCard(p)).join('');
}

function renderPartyCard(p) {
  const init = (p.name || '?').charAt(0).toUpperCase();
  const balance = p.balance || 0;
  const isSupplier = p.type === 'supplier';
  
  const balCls = isSupplier 
    ? (balance > 0 ? 'credit' : balance < 0 ? 'debit' : 'zero')
    : (balance > 0 ? 'credit' : balance < 0 ? 'debit' : 'zero');
  
  const balLabel = isSupplier 
    ? (balance > 0 ? 'देना है' : balance < 0 ? 'एडवांस' : 'साफ')
    : (balance > 0 ? 'लेना है' : balance < 0 ? 'एडवांस' : 'साफ');

  return `
    <div class="party-card ${isSupplier ? 'supplier' : 'customer'}" onclick="openParty('${p.id}')">
      <div class="pc-header">
        <div class="pc-avatar ${isSupplier ? 'supplier' : 'customer'}">${esc(init)}</div>
        <div class="pc-info">
          <div class="pc-name">
            ${esc(p.name)} 
            <span class="pc-badge ${isSupplier ? 'supplier' : 'customer'}">${isSupplier ? 'सप्लायर' : 'ग्राहक'}</span>
          </div>
          <div class="pc-phone">${esc(p.phone || '-')}</div>
        </div>
        <div class="pc-balance">
          <div class="pc-balance-amt ${balCls}">₹${Math.abs(balance).toLocaleString('en-IN')}</div>
          <div class="pc-balance-lbl">${balLabel}</div>
        </div>
      </div>
    </div>
  `;
}

        <span class="btn-loader hidden"><span class="spinner"></span></span>
      </button>
    </div>
  `);
  setTimeout(() => document.getElementById('mAmt')?.focus(), 300);

async function saveTxn(type) {
  const amt = parseFloat(document.getElementById('mAmt').value);
  const note = document.getElementById('mNote').value.trim();
  const date = document.getElementById('mDate').value;
  const btn = document.querySelector('#activeModal .btn-primary');

  if (!amt || amt <= 0) return showToast('रकम डालें', 'error');

  setBtnLoading(btn, true);

  try {
    const p = parties.find(x => x.id === currentPartyId);
    if (!p) throw new Error('Party not found');

    // Add transaction
    await db.collection('users').doc(currentUser.uid).collection('transactions').add({
      partyId: currentPartyId,
      type: type,
      amount: amt,
      note: note,
      date: date,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    // Update party balance
    const newBalance = (p.balance || 0) + (type === 'udhaar' ? amt : -amt);
    await db.collection('users').doc(currentUser.uid).collection('parties').doc(currentPartyId).update({
      balance: newBalance,
      lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
    });

    closeModal();
    showToast('✅ सेव हो गया!', 'success');
  } catch (error) {
    console.error('Save txn error:', error);
    showToast('सेव नहीं हुआ', 'error');
    setBtnLoading(btn, false);
  }
}

  const startDate = document.getElementById('mStart').value;
  const note = document.getElementById('mNote').value.trim();
  const btn = document.querySelector('#activeModal .btn-primary');

      partyId: currentPartyId,

      startDate: startDate,
      note: note,
      status: 'active',
      interestPaid: 0,
      date: startDate,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()

  setBtnLoading(btn, true);

  try {
    // Delete all transactions of this party
    const txns = transactions.filter(t => t.partyId === currentPartyId);
    for (const t of txns) {
      await db.collection('users').doc(currentUser.uid).collection('transactions').doc(t.id).delete();
    }
    
    // Delete party
    await db.collection('users').doc(currentUser.uid).collection('parties').doc(currentPartyId).delete();

    closeModal();
    currentPartyId = null;
    switchTab('dashboard');
    showToast('✅ डिलीट हो गया', 'success');
  } catch (error) {
    console.error('Delete error:', error);
    showToast('डिलीट नहीं हुआ', 'error');
    setBtnLoading(btn, false);
  }
}

/* ============ REPORTS ============ */
function renderReports() {
  let totalUdhaar = 0, totalJama = 0, totalByaj = 0;
  
  transactions.forEach(t => {
    if (t.type === 'udhaar' || t.type === 'supplier_give') totalUdhaar += t.amount || 0;
    else if (t.type === 'jama' || t.type === 'supplier_pay' || t.type === 'loan_repay' || t.type === 'interest_paid') totalJama += t.amount || 0;
    else if (t.type === 'byaj_loan') totalByaj += t.principal || 0;
  });

  document.getElementById('reportsContent').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
      <div style="background:var(--credit-bg);border:2px solid #fecaca;border-radius:14px;padding:14px">
        <div style="font-size:10px;color:#991b1b;font-weight:800;text-transform:uppercase">कुल उधार</div>
        <div style="font-size:22px;font-weight:900;color:var(--credit);margin-top:4px">${fmt(totalUdhaar)}</div>
      </div>
      <div style="background:var(--debit-bg);border:2px solid #bbf7d0;border-radius:14px;padding:14px">
        <div style="font-size:10px;color:#065f46;font-weight:800;text-transform:uppercase">कुल जमा</div>
        <div style="font-size:22px;font-weight:900;color:var(--debit);margin-top:4px">${fmt(totalJama)}</div>
      </div>
      <div style="background:var(--interest-bg);border:2px solid #fde68a;border-radius:14px;padding:14px">
        <div style="font-size:10px;color:#92400e;font-weight:800;text-transform:uppercase">कुल ब्याज लोन</div>
        <div style="font-size:22px;font-weight:900;color:var(--interest);margin-top:4px">${fmt(totalByaj)}</div>
      </div>
      <div style="background:var(--primary-lighter);border:2px solid var(--primary-light);border-radius:14px;padding:14px">
        <div style="font-size:10px;color:var(--primary-dark);font-weight:800;text-transform:uppercase">कुल ग्राहक</div>
        <div style="font-size:22px;font-weight:900;color:var(--primary);margin-top:4px">${parties.length}</div>
      </div>
    </div>
    
    <div style="background:var(--white);border:2px solid var(--border);border-radius:14px;padding:16px;margin-top:14px">
      <div style="font-size:13px;font-weight:900;margin-bottom:12px;text-transform:uppercase">टॉप ग्राहक (बकाया द्वारा)</div>
      ${parties.filter(p => p.balance > 0).sort((a,b) => b.balance - a.balance).slice(0, 5).map(p => `
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
          <span style="font-size:13px;font-weight:700">${esc(p.name)}</span>
          <span style="font-size:14px;font-weight:900;color:var(--credit)">₹${p.balance.toLocaleString('en-IN')}</span>
        </div>
      `).join('') || '<div style="color:var(--text-muted);font-size:13px;text-align:center;padding:20px">कोई बकाया नहीं</div>'}
    </div>

    <div style="background:var(--white);border:2px solid var(--border);border-radius:14px;padding:16px;margin-top:14px">
      <div style="font-size:13px;font-weight:900;margin-bottom:12px;text-transform:uppercase">सारे लेन-देन</div>
      ${transactions.slice(0, 20).map(t => {
        const p = parties.find(x => x.id === t.partyId);
        return `
          <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
            <div>
              <div style="font-size:13px;font-weight:700">${esc(p?.name || 'Unknown')}</div>
              <div style="font-size:11px;color:var(--text-muted)">${dateStr(t.date)} • ${t.type}</div>
            </div>
            <span style="font-size:13px;font-weight:900;color:var(--text)">₹${(t.amount || t.principal || 0).toLocaleString('en-IN')}</span>
          </div>
        `;
      }).join('') || '<div style="color:var(--text-muted);font-size:13px;text-align:center;padding:20px">कोई लेन-देन नहीं</div>'}
    </div>
  `;
}

/* ============ NAVIGATION ============ */
function switchTab(tab) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.btab').forEach(b => b.classList.remove('active'));

  if (tab === 'dashboard') {
    document.getElementById('screen-dashboard').classList.add('active');
    document.querySelector('.btab[data-view="dashboard"]').classList.add('active');
    document.getElementById('fab').style.display = 'flex';
    renderDashboard();
  } else if (tab === 'party') {
    document.getElementById('screen-party').classList.add('active');
    document.getElementById('fab').style.display = 'none';
  } else if (tab === 'reports') {
    document.getElementById('screen-reports').classList.add('active');
    document.querySelector('.btab[data-view="reports"]').classList.add('active');
    document.getElementById('fab').style.display = 'none';
    renderReports();
  } else if (tab === 'settings') {
    openSettingsModal();
  }
  
  document.getElementById('screenContainer').scrollTop = 0;
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.filter === f));
  renderDashboard();
}

function openEditBusiness() {
  showModal(`
    <div class="modal-handle"></div>
    <div class="modal-title">🏪 दुकान एडिट</div>
    <div class="input-group">
      <label class="input-label">व्यवसाय का नाम</label>
      <input type="text" id="mShopName" class="text-input" value="${esc(userData?.shopName || '')}">
    </div>
    <div class="input-group">
      <label class="input-label">UPI ID</label>
      <input type="text" id="mUpi" class="text-input" value="${esc(userData?.upiId || '')}" placeholder="yourname@upi">
    </div>

      <label class="input-label">डिफ़ॉल्ट ब्याज दर (%)</label>

    </div>

      <button class="btn btn-secondary" onclick="closeModal()">रद्द</button>
      <button class="btn btn-primary" onclick="updateBusiness()">
        <span class="btn-text">सेव करें</span>
        <span class="btn-loader hidden"><span class="spinner"></span></span>
      </button>

async function updateBusiness() {
  const shopName = document.getElementById('mShopName').value.trim();
  const upiId = document.getElementById('mUpi').value.trim();
  const defaultRate = parseFloat(document.getElementById('mRate').value) || 2;
  const btn = document.querySelector('#activeModal .btn-primary');

  if (!shopName) return showToast('दुकान का नाम डालें', 'error');

  setBtnLoading(btn, true);

  try {
    await db.collection('users').doc(currentUser.uid).update({
      shopName: shopName,
      upiId: upiId,
      defaultRate: defaultRate
    });
    userData.shopName = shopName;
    userData.upiId = upiId;
    userData.defaultRate = defaultRate;
    
    document.getElementById('dashShop').textContent = shopName;
    document.getElementById('topTitle').textContent = '📒 ' + shopName;
    
    closeModal();
    showToast('✅ सेव हो गया!', 'success');
  } catch (error) {
    console.error('Update error:', error);
    showToast('सेव नहीं हुआ', 'error');
    setBtnLoading(btn, false);
  }
}

function exportData() {
  const data = {
    user: userData,
    parties: parties,
    transactions: transactions,
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `babasitaram_backup_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('✅ एक्सपोर्ट हो गया!', 'success');
}

/* ============ LOGOUT ============ */
async function handleLogout() {
  if (!confirm('लॉगआउट करें?')) return;
  try {
    if (unsubParties) unsubParties();
    if (unsubTransactions) unsubTransactions();
    await auth.signOut();
    window.location.href = 'index.html';
  } catch (error) {
    console.error('Logout error:', error);
  }
}

/* ============ HELPERS ============ */
function fmt(n) { return '₹' + Math.round(Math.abs(n) || 0).toLocaleString('en-IN'); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function dateStr(d) {
  if (!d) return '-';
  try {
    const date = d.toDate ? d.toDate() : new Date(d);
    return date.toLocaleDateString('hi-IN', { day: '2-digit', month: 'short', year: 'numeric' });
  } catch (e) { return '-'; }
}

function showModal(html) {
  closeModal();
  const div = document.createElement('div');
  div.id = 'activeModal';
  div.className = 'modal-overlay';
  div.innerHTML = `<div class="modal" onclick="event.stopPropagation()">${html}</div>`;
  div.onclick = e => { if (e.target === div) closeModal(); };
  document.body.appendChild(div);
}

function closeModal() {
  const m = document.getElementById('activeModal');
  if (m) m.remove();
}

function setBtnLoading(btn, loading) {
  if (!btn) return;
  const txt = btn.querySelector('.btn-text');
  const loader = btn.querySelector('.btn-loader');
  btn.disabled = loading;
  if (txt) txt.classList.toggle('hidden', loading);
  if (loader) loader.classList.toggle('hidden', !loading);
}

function showToast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2800);
}

  console.log('🚀 Dashboard loaded');
