<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - BABASITARAM PRO</title>
<style>
body{font-family:'Noto Sans Devanagari',sans-serif;background:#f8fafc;margin:0;padding:20px;min-height:100vh}
.card{max-width:480px;margin:40px auto;background:#fff;padding:30px;border-radius:20px;box-shadow:0 4px 20px rgba(0,0,0,.08);text-align:center}
h1{background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:0 0 10px;font-size:24px}
p{color:#64748b;margin:8px 0}
.btn{background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%);color:#fff;border:none;padding:14px 24px;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;margin-top:20px;width:100%;max-width:300px}
</style>
</head>
<body>
<div class="card">
  <h1>🎉 स्वागत है!</h1>
  <p>Dashboard yahan aayega</p>
  <p style="font-size:12px" id="userInfo">Loading...</p>
  <button class="btn" onclick="logout()">🚪 Logout</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
auth.onAuthStateChanged(async (user) => {
  if (!user) { window.location.href = 'index.html'; return; }
  document.getElementById('userInfo').textContent = user.email;
});
async function logout() {
  await auth.signOut();
  window.location.href = 'index.html';
}
</script>
</body>
</html>
