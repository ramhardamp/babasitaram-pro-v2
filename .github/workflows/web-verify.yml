name: Guru Shree Web Verification

on:
  push:
    branches:
      - main
      - production-okcredit-safety-fix-20260929
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify web contract
        run: node scripts/verify-web.mjs
