name: Web CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - production-okcredit-safety-fix-20260929
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit + portal + PIN + Android-generator tests
        run: npm test
      - name: Verify web contract
        run: node scripts/verify-web.mjs
      - name: Verify single-source version
        run: node scripts/sync-version.mjs --check

  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - name: Firestore rules tests (emulator)
        run: npm run test:rules
