name: BABASITARAM PRO Android Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify web features
        run: npm run verify:web
      - name: Prepare Capacitor web assets
        run: npm run prepare:web
      - name: Add Android platform
        run: npx cap add android
      - name: Prepare native Android SMS scheduler
        run: node scripts/prepare-android.mjs
      - name: Generate branded Android icon and splash
        run: npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#1e1b4b' --iconBackgroundColorDark '#111827' --splashBackgroundColor '#1e1b4b' --splashBackgroundColorDark '#0f172a'
      - name: Sync Android
        run: npx cap sync android
      - name: Build debug-signed APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace
      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK=$APK"
      - name: Verify APK signature
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "${{ steps.apk.outputs.path }}"
      - name: Verify APK manifest with aapt
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT=$(find "$SDK/build-tools" -type f -name aapt | sort -V | tail -1)
          test -n "$AAPT"
          "$AAPT" dump badging "${{ steps.apk.outputs.path }}" | tee apk-badging.txt
          grep -q "package: name='com.babasitaram.pro'" apk-badging.txt
          "$AAPT" dump permissions "${{ steps.apk.outputs.path }}" | grep -q "android.permission.SEND_SMS"
      - name: Verify APK archive
        run: |
          unzip -t "${{ steps.apk.outputs.path }}"
          unzip -l "${{ steps.apk.outputs.path }}" | grep -Eq "mipmap|launcher"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BABASITARAM-PRO-debug-signed-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator install + runtime smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb wait-for-device
            sleep 5
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.babasitaram.pro
            adb logcat -c
            adb shell am start -W -n com.babasitaram.pro/.MainActivity
            sleep 8
            adb shell pidof com.babasitaram.pro
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | grep -q "com.babasitaram.pro"
            adb logcat -d -t 500 | tee runtime-logcat.txt
            grep -Eiq "FATAL EXCEPTION|AndroidRuntime.*FATAL" runtime-logcat.txt && exit 1 || true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-build-${GITHUB_RUN_ID}"
          gh release create "$TAG" "${{ steps.apk.outputs.path }}" --title "BABASITARAM PRO Android $TAG" --notes "Automated debug-signed APK. Signature, aapt manifest, unzip archive, emulator installation, resolved activity launch, running process, resumed activity and runtime fatal-exception checks passed."
