<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e1b4b">
<title>Forgot Password - BABASITARAM PRO</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#6366f1;--primary-dark:#4f46e5;--primary-light:#e0e7ff;--primary-lighter:#eef2ff;--gradient:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#a855f7 100%);--gradient-dark:linear-gradient(135deg,#1e1b4b 0%,#312e81 100%);--text:#0f172a;--text-muted:#64748b;--text-light:#94a3b8;--border:#e2e8f0;--bg:#f8fafc;--white:#fff;--error:#ef4444;--error-bg:#fef2f2;--success:#10b981;--success-bg:#ecfdf5;--info-bg:#eff6ff;--radius-md:14px;--radius-lg:20px;--radius-full:999px}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans Devanagari',sans-serif;background:linear-gradient(135deg,#1e1b4b 0%,#312e81 50%,#4c1d95 100%);color:var(--text);font-size:16px;line-height:1.5;overflow-x:hidden}
body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh}
.app-shell{width:100%;max-width:480px;min-height:100vh;background:var(--bg);position:relative;box-shadow:0 0 80px rgba(0,0,0,.3);overflow:hidden;display:flex;flex-direction:column}
@media(min-width:500px){body{padding:24px 0}.app-shell{min-height:calc(100vh - 48px);border-radius:32px;max-height:940px}}
.brand-header{background:var(--gradient-dark);padding:22px 20px 20px;text-align:center;position:relative;overflow:hidden;border-radius:0 0 28px 28px;margin-bottom:18px;box-shadow:0 12px 40px rgba(30,27,75,.3)}
.brand-header::before{content:'';position:absolute;top:-50%;right:-30%;width:250px;height:250px;background:radial-gradient(circle,rgba(139,92,246,.4) 0%,transparent 70%);border-radius:50%}
.brand-logo-top{width:60px;height:60px;margin:0 auto 10px;background:rgba(255,255,255,.12);backdrop-filter:blur(20px);border:1.5px solid rgba(255,255,255,.2);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;position:relative;z-index:1}
.brand-title{font-size:16px;font-weight:900;color:#fff;letter-spacing:1.5px;position:relative;z-index:1}
.brand-title-line2{display:block;font-size:11px;letter-spacing:2.5px;color:#fcd34d;margin-top:3px;font-weight:800}
.screen-container{flex:1;overflow-y:auto;padding:0 20px 30px}
.card{background:var(--white);border-radius:var(--radius-lg);padding:22px 20px;box-shadow:0 4px 16px rgba(0,0,0,.05);border:1.5px solid var(--border);margin-bottom:16px}
.card-title{font-size:20px;font-weight:900;margin-bottom:6px}
.card-subtitle{font-size:13px;color:var(--text-muted);margin-bottom:18px;line-height:1.5}
.input-group{margin-bottom:16px}
.input-label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
.email-input{width:100%;border:2px solid var(--border);border-radius:var(--radius-md);padding:15px 16px;font-size:15px;font-weight:500;font-family:inherit;outline:none;background:var(--white);color:var(--text);height:56px;transition:all .2s}
.email-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-light)}
.btn{width:100%;padding:15px 20px;font-size:15px;font-weight:800;border:none;border-radius:var(--radius-md);cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;transition:all .2s}
.btn-primary{background:var(--gradient);color:#fff;box-shadow:0 6px 20px rgba(99,102,241,.35);margin-top:6px}
.btn-primary:disabled{background:#cbd5e1;cursor:not-allowed}
.btn-secondary{background:var(--white);color:var(--text);border:2px solid var(--border);margin-top:10px}
.error-text{color:var(--error);font-size:12px;margin-top:10px;text-align:center;padding:10px 14px;background:var(--error-bg);border-radius:8px;font-weight:600;border:1px solid #fecaca}
.success-text{color:var(--success);font-size:13px;margin-top:14px;text-align:center;padding:14px 16px;background:var(--success-bg);border-radius:var(--radius-md);font-weight:700;border:1px solid #bbf7d0}
.hidden{display:none!important}
.spinner{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.footer-bar{text-align:center;font-size:11px;color:var(--text-muted);padding:20px 0 10px}
.footer-bar a{color:var(--primary);text-decoration:none;font-weight:800}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:13px 24px;border-radius:var(--radius-full);font-size:13px;font-weight:700;z-index:999;opacity:0;transition:all .3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--success)}
.toast.error{background:var(--error)}
</style>
</head>
<body>
<div class="app-shell">
  <div class="brand-header">
    <div class="brand-logo-top"><img src="assets/logo.svg" alt="Guru Shree" style="width:100%;height:100%;object-fit:cover;border-radius:inherit"></div>
    <div class="brand-title">BABASITARAM PRO<span class="brand-title-line2">DIGITAL KHATA</span></div>
  </div>

  <div class="screen-container">
    <div class="card" style="margin-top:20px">
      <div class="card-title">पासवर्ड भूल गए?</div>
      <div class="card-subtitle">अपना ईमेल डालें, हम reset link भेजेंगे।</div>

      <div class="input-group">
        <label class="input-label">ईमेल पता</label>
        <input type="email" id="resetEmail" class="email-input" placeholder="your@email.com" inputmode="email" autocomplete="email">
      </div>

      <p id="resetError" class="error-text hidden"></p>

      <button id="resetBtn" class="btn btn-primary" onclick="sendResetLink()">
        <span class="btn-text">📧 Reset Link भेजें</span>
        <span class="btn-loader hidden"><span class="spinner"></span></span>
      </button>

      <p id="resetSent" class="success-text hidden">✅ Reset link भेज दिया गया! ईमेल चेक करें।</p>

      <a href="index.html" style="text-decoration:none">
        <button class="btn btn-secondary" style="margin-top:14px">← लॉगिन पर वापस जाएं</button>
      </a>
    </div>

    <div class="footer-bar">सहायता: <a href="mailto:ramhardamp@gmail.com">ramhardamp@gmail.com</a></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
async function sendResetLink() {
  const email = document.getElementById('resetEmail').value.trim();
  const errorEl = document.getElementById('resetError');
  const sentEl = document.getElementById('resetSent');
  const btn = document.getElementById('resetBtn');

  errorEl.classList.add('hidden');
  sentEl.classList.add('hidden');

  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    errorEl.textContent = 'कृपया सही ईमेल डालें';
    errorEl.classList.remove('hidden');
    return;
  }

  const txt = btn.querySelector('.btn-text');
  const loader = btn.querySelector('.btn-loader');
  btn.disabled = true;
  txt.classList.add('hidden');
  loader.classList.remove('hidden');

  try {
    await auth.sendPasswordResetEmail(email, {
      url: window.location.origin + window.location.pathname.replace('forgot-password.html', 'index.html')
    });
    sentEl.classList.remove('hidden');
    showToast('Reset link भेज दिया गया!', 'success');
  } catch (error) {
    console.error(error);
    let msg = 'कुछ गड़बड़ हुई। दोबारा कोशिश करें।';
    if (error.code === 'auth/user-not-found') msg = 'यह ईमेल रजिस्टर्ड नहीं है।';
    else if (error.code === 'auth/invalid-email') msg = 'ईमेल सही नहीं है।';
    else if (error.code === 'auth/too-many-requests') msg = 'बहुत ज्यादा कोशिशें। कुछ देर बाद करें।';
    errorEl.textContent = msg;
    errorEl.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    txt.classList.remove('hidden');
    loader.classList.add('hidden');
  }
}

function showToast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2800);
}

window.addEventListener('load', () => {
  setTimeout(() => document.getElementById('resetEmail')?.focus(), 400);
});
</script>
</body>
</html>
